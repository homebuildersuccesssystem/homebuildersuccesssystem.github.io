<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Builder Success System</title>
<meta name="theme-color" content="#0a7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Builder">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#f4f7f6}iframe{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:0;display:block}
#ncm-sh{position:fixed;inset:0;z-index:10;background:rgba(10,10,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom));font:16px/1.4 -apple-system,system-ui,Roboto,Arial,sans-serif}#ncm-sh[hidden]{display:none}
#ncm-sh .c{position:relative;width:min(420px,100%);background:#fff;border-radius:18px;padding:18px 16px 14px;display:grid;gap:10px;text-align:center}#ncm-sh small{color:#6b7280;word-break:break-all}
#ncm-sh .s{min-height:50px;border:0;border-radius:999px;background:linear-gradient(135deg,#12866c,#0b6b57);color:#fff;font:inherit;font-weight:700;font-size:17px}#ncm-sh .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:#eef0f2;font-size:20px}#ncm-sh .e{color:#9b0b12;font-size:13px;word-break:break-word}#ncm-sh .e.ok{color:#0b6b57}#ncm-sh .e:empty{display:none}#ncm-sh .h{margin:0;font-size:12.5px;color:#6b7280}
#ncm-sh .o{min-height:50px;border:0;border-radius:999px;background:linear-gradient(135deg,#12866c,#0b6b57);color:#fff;font:inherit;font-weight:700;font-size:17px}#ncm-sh .d{min-height:46px;border:0;border-radius:999px;background:#eef5f2;color:#0b6b57;font:inherit;font-weight:700}#ncm-sh button[hidden]{display:none}</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbzuIDyEK6gtThrKnmUxQGx2pxcfBNTyrpxbuDFKPuCQU-rPp9WQpiHxT-ryUncqiqdf/exec?v=baocao&amp;w=1" title="Home Builder Success System" allow="clipboard-read; clipboard-write; camera; microphone; fullscreen; web-share" allowfullscreen></iframe>
<div id="ncm-sh" hidden role="dialog" aria-label="Chia sẻ"><div class="c"><button class="x" type="button" aria-label="Đóng">×</button><b>Chia sẻ file</b><small class="n"></small><button class="s" type="button">Chia sẻ</button><button class="o" type="button" hidden>Mở trang chia sẻ</button><button class="d" type="button">Tải xuống</button><div class="e"></div><p class="h">Không thấy bảng chia sẻ? Bấm Tải xuống rồi gửi file vào Zalo.</p></div></div>
<script>
// Cầu nối chia sẻ (@297, @298): app trong khung Google gửi tệp lên đây (chỉ nhận máy chủ Apps Script của Google).
// @298: Samsung Internet báo "NotAllowedError: Permission denied" ngay cả khi chạm trực tiếp ở trang này. Nên:
//  - Tải xuống ngay trên hộp (tệp thật, <a download>);
//  - Chia sẻ: tạm ẩn khung app (phòng trường hợp khung khác nguồn làm trình duyệt chặn) rồi gọi share() NGAY trong cú chạm;
//  - share() bị từ chối (NotAllowed/NotSupported/TypeError) -> nhớ trên máy này; hộp đổi sang nút "Mở trang chia sẻ" (chia-se.html: trang riêng, không khung);
//    lần sau chạm Chia sẻ là mở thẳng trang đó. Mở tab ngay trong cùng cú chạm với share() không được: share() dùng mất cú chạm
//    (popup bị chặn), còn mở tab trước thì trang này ra nền và share() chắc chắn bị từ chối.
(function(){
  var OK = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/, box = document.getElementById('ncm-sh'), ifr = document.querySelector('iframe'), cur = null, KD = 'ncm-share-denied';
  var $ = function(s){ return box.querySelector(s); }, el = $('.e');
  function denied(){ try{ return localStorage.getItem(KD) === '1'; }catch(e){ return false; } }
  function setDenied(v){ try{ v ? localStorage.setItem(KD, '1') : localStorage.removeItem(KD); }catch(e){} }
  function reply(m){ try{ cur && cur.src.postMessage(m, cur.o); }catch(e){} }
  function url(){ if(!cur.u) cur.u = URL.createObjectURL(cur.f); return cur.u; }
  function down(){ if(!cur) return; var a = document.createElement('a'); a.href = url(); a.download = cur.f.name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    el.className = 'e ok'; el.textContent = 'Đã tải xuống ' + cur.f.name + '. Mở Zalo → đính kèm file từ mục Tải xuống.'; }
  function mode(fb){ $('.s').hidden = !!fb; $('.o').hidden = !fb; }
  function openTab(){   // gọi NGAY trong cú chạm; trang chia-se.html xin tệp qua postMessage (cùng nguồn)
    if(!cur) return false; var w = null; try{ w = window.open('chia-se.html', '_blank'); }catch(e){}
    if(!w){ el.className = 'e'; el.textContent = 'Trình duyệt chặn mở tab mới. Bấm Tải xuống rồi gửi file vào Zalo.'; return false; }
    cur.tab = w; el.className = 'e ok'; el.textContent = 'Đã mở trang chia sẻ ở tab mới: bấm Chia sẻ ở đó, hoặc Tải xuống.'; reply({type:'ncm-share-result', id: cur.id, ok: 0, err: 'tab'}); return true; }
  function share(){ if(!cur) return; var f = cur.f; el.className = 'e'; el.textContent = '';
    if(denied() || (navigator.canShare && !safe(function(){ return navigator.canShare({files:[f]}); })) || typeof navigator.share !== 'function'){ mode(1); openTab(); return; }
    var p, hid = false; try{ if(ifr){ ifr.style.display = 'none'; hid = true; } p = navigator.share({title: f.name, files:[f]}); }catch(x){ p = Promise.reject(x); }
    p.then(function(){ setDenied(0); box.hidden = true; reply({type:'ncm-share-result', id: cur.id, ok: 1}); })
     .catch(function(x){ var n = x && x.name || 'Lỗi', s = n + ': ' + (x && x.message || x); if(n === 'AbortError'){ reply({type:'ncm-share-result', id: cur.id, ok: 0, err: s}); return; }
       if(/^(NotAllowedError|NotSupportedError|TypeError|DataError)$/.test(n) && !/gesture|activation/i.test(s)){ setDenied(1); mode(1); }
       el.className = 'e'; el.textContent = 'Không chia sẻ được: ' + s + '. Bấm "Mở trang chia sẻ" hoặc Tải xuống.'; box.hidden = false; reply({type:'ncm-share-result', id: cur.id, ok: 0, err: s}); })
     .then(function(){ if(hid) ifr.style.display = ''; }); }
  function safe(fn){ try{ return fn(); }catch(e){ return false; } }
  $('.s').onclick = share; $('.o').onclick = function(){ openTab(); }; $('.d').onclick = down; $('.x').onclick = function(){ box.hidden = true; };
  window.addEventListener('message', function(e){ var d = e.data || {};
    if(e.origin === location.origin && d.type === 'ncm-tab-ready' && cur && e.source === cur.tab){ e.source.postMessage({type:'ncm-file', name: cur.f.name, mime: cur.f.type, blob: cur.f}, location.origin); return; }
    if(!OK.test(e.origin)) return;
    if(d.type === 'ncm-ping'){ e.source.postMessage({type:'ncm-pong', v: 2, share: typeof navigator.share === 'function'}, e.origin); return; }
    if(d.type === 'ncm-share' && d.buf && d.name){ if(cur && cur.u) URL.revokeObjectURL(cur.u);
      cur = {src: e.source, o: e.origin, id: d.id, f: new File([d.buf], String(d.name).slice(0, 120), {type: String(d.mime || 'application/octet-stream')})};
      $('.n').textContent = cur.f.name + ' · ' + Math.round(cur.f.size / 1024) + ' KB'; el.className = 'e'; el.textContent = ''; mode(denied()); box.hidden = false;
      if(navigator.userActivation && navigator.userActivation.isActive) share(); } });   // cú chạm trong app vẫn còn hiệu lực ở trang cha -> làm luôn
})();
</script>
</body>
</html>
