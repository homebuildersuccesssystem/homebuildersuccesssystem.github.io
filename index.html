<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Builder Success System</title>
<meta name="theme-color" content="#0a7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Builder">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#f4f7f6}iframe{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:0;display:block}
#ncm-sh{position:fixed;inset:0;z-index:10;background:rgba(10,10,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom));font:16px/1.4 -apple-system,system-ui,Roboto,Arial,sans-serif}#ncm-sh[hidden]{display:none}
#ncm-sh .c{position:relative;width:min(420px,100%);background:#fff;border-radius:18px;padding:18px 16px 14px;display:grid;gap:10px;text-align:center}#ncm-sh small{color:#6b7280;word-break:break-all}
#ncm-sh .s{min-height:50px;border:0;border-radius:999px;background:linear-gradient(135deg,#12866c,#0b6b57);color:#fff;font:inherit;font-weight:700;font-size:17px}#ncm-sh .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:#eef0f2;font-size:20px}#ncm-sh .e{color:#9b0b12;font-size:13px}#ncm-sh .e:empty{display:none}</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbzuIDyEK6gtThrKnmUxQGx2pxcfBNTyrpxbuDFKPuCQU-rPp9WQpiHxT-ryUncqiqdf/exec?v=baocao&amp;w=1" title="Home Builder Success System" allow="clipboard-read; clipboard-write; camera; microphone; fullscreen; web-share" allowfullscreen></iframe>
<div id="ncm-sh" hidden role="dialog" aria-label="Chia sẻ"><div class="c"><button class="x" type="button" aria-label="Đóng">×</button><b>Chia sẻ file</b><small class="n"></small><button class="s" type="button">Chia sẻ</button><div class="e"></div></div></div>
<script>
// Cầu nối chia sẻ (@297): app trong khung Google gửi tệp lên đây; trang cấp cao nhất gọi navigator.share({files}). Chỉ nhận từ máy chủ Apps Script của Google.
(function(){
  var OK = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/, box = document.getElementById('ncm-sh'), cur = null;
  function reply(m){ try{ cur && cur.src.postMessage(m, cur.o); }catch(e){} }
  function share(){ if(!cur) return; var f = cur.f, el = box.querySelector('.e'); el.textContent = '';
    var p; try{ if(navigator.canShare && !navigator.canShare({files:[f]})) throw new DOMException('Máy không chia sẻ được loại tệp này (canShare = false)', 'NotSupportedError'); p = navigator.share({files:[f]}); }catch(x){ p = Promise.reject(x); }
    p.then(function(){ box.hidden = true; reply({type:'ncm-share-result', id: cur.id, ok: 1}); })
     .catch(function(x){ var s = (x && x.name || 'Lỗi') + ': ' + (x && x.message || x); if(!(x && x.name === 'AbortError')){ el.textContent = 'Không chia sẻ được: ' + s; box.hidden = false; } reply({type:'ncm-share-result', id: cur.id, ok: 0, err: s}); }); }
  box.querySelector('.s').onclick = share; box.querySelector('.x').onclick = function(){ box.hidden = true; };
  window.addEventListener('message', function(e){ var d = e.data || {}; if(!OK.test(e.origin)) return;
    if(d.type === 'ncm-ping'){ e.source.postMessage({type:'ncm-pong', v: 1, share: typeof navigator.share === 'function'}, e.origin); return; }
    if(d.type === 'ncm-share' && d.buf && d.name){ cur = {src: e.source, o: e.origin, id: d.id, f: new File([d.buf], String(d.name).slice(0, 120), {type: String(d.mime || 'application/octet-stream')})};
      box.querySelector('.n').textContent = cur.f.name + ' · ' + Math.round(cur.f.size / 1024) + ' KB';
      if(navigator.userActivation && navigator.userActivation.isActive) share();   // cú chạm trong app vẫn còn hiệu lực ở trang cha -> mở bảng chia sẻ luôn
      else { box.querySelector('.e').textContent = ''; box.hidden = false; } } });
})();
</script>
</body>
</html>
